# Forward the edge's scheme to the backend only when the TCP peer is a trusted edge proxy and
# the value is exactly http/https; otherwise this hop's own scheme (#250). Trusted peers come
# from EDGE_TRUSTED_PROXIES at startup (docker-entrypoint.sh); unset trusts nobody.
# $realip_remote_addr is the peer itself: set_real_ip_from below rewrites $remote_addr to the client.
geo $realip_remote_addr $from_edge {
    default 0;
    include /etc/nginx/conf.d/edge-trust.inc;
}

map "$from_edge:$http_x_forwarded_proto" $edge_proto {
    "1:https" https;
    "1:http"  http;
    default   $scheme;
}

# Map for WebSocket Connection header
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;  # Non-privileged port (was 80)
    # Relative Location headers: absolute ones would leak the internal :8080 and http scheme
    absolute_redirect off;
    server_name _;

    # The client address behind NPM: walk X-Forwarded-For from the right past private proxy
    # hops, so $remote_addr (sent on as X-Real-IP) is the real client, never a spoofed entry (#374)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Client upload size limit
    client_max_body_size 10M;

    # Serve pre-compressed files (gzip/brotli from build)
    gzip_static on;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.api+json;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # CSP Policy:
    # - script-src: 'unsafe-inline' needed for Vite's runtime config injection (env-config.js)
    # - style-src: 'unsafe-inline' required by Vuetify 3 for dynamic theming (uses el.setAttribute('style'))
    # - unsafe-eval: NOT included (Vue 3 runtime-only build is CSP-compliant)
    # Future improvement: Implement CSP nonces for script-src and migrate Vuetify theme to CSS variables
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # The FAQ moved into About; keep old links and search results working
    location = /faq {
        return 301 /about#faq;
    }
    location = /faq/ {
        return 301 /about#faq;
    }

    # Vite build assets have content hashes - safe for immutable caching
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend static assets
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/index.html $uri.html /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Runtime environment config
    location /env-config.js {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # Sitemap proxy to backend
    location = /sitemap.xml {
        proxy_pass http://kidney_genetics_backend:8000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
    }

    # Backend API proxy - FIXED: Use correct container name with underscores
    location /api/ {
        proxy_pass http://kidney_genetics_backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # OpenAPI documentation (Swagger UI, ReDoc, schema) proxied to the backend.
    # FastAPI serves these at the backend root (/docs, /redoc, /openapi.json), so
    # they are NOT under /api/ and need their own proxy rules.
    #
    # Swagger UI and ReDoc load their JS/CSS from the jsdelivr CDN, which the strict
    # global CSP (script-src 'self') would block. These locations therefore set a
    # relaxed, docs-scoped CSP. add_header in a location replaces the inherited
    # server-level headers; the remaining security headers (X-Frame-Options, etc.)
    # are emitted by the backend's SecurityHeadersMiddleware and pass through.
    location = /openapi.json {
        proxy_pass http://kidney_genetics_backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /docs {
        proxy_pass http://kidney_genetics_backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_set_header X-Forwarded-Host $host;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; font-src 'self' data: https://cdn.jsdelivr.net; worker-src 'self' blob:;" always;
    }

    location = /redoc {
        proxy_pass http://kidney_genetics_backend:8000/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_set_header X-Forwarded-Host $host;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.redoc.ly; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; worker-src 'self' blob:;" always;
    }

    # WebSocket support. The backend's only socket is /api/progress/ws: clients reach it
    # directly (DataSourceProgress) or via the WS_URL prefix /ws (services/websocket.ts).
    location ~ ^/(ws|api)/progress/ws$ {
        rewrite ^ /api/progress/ws break;
        proxy_pass http://kidney_genetics_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;  # Use mapped variable
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;

        # WebSocket timeouts (longer)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check (returns JSON for monitoring tools)
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"kidney_genetics_frontend"}';
    }
}
