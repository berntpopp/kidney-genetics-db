# Forward the edge's scheme to the backend only when the TCP peer is a trusted edge proxy and
# the value is exactly http/https; otherwise this hop's own scheme (#250). Trusted peers come
# from EDGE_TRUSTED_PROXIES at startup (docker-entrypoint.sh); unset trusts nobody.
# $realip_remote_addr is the peer itself: set_real_ip_from below rewrites $remote_addr to the client.
geo $realip_remote_addr $from_edge {
    default 0;
    include /etc/nginx/conf.d/edge-trust.inc;
}

map "$from_edge:$http_x_forwarded_proto" $edge_proto {
    "1:https" https;
    "1:http"  http;
    default   $scheme;
}

# Map for WebSocket Connection header
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Content-Security-Policy per route (used by security-headers.inc).
# - script-src: 'unsafe-inline' needed for the runtime config injection (env-config.js)
# - style-src: 'unsafe-inline' needed for inline style attributes set at runtime
# - unsafe-eval: NOT included (Vue 3 runtime-only build is CSP-compliant)
# - media-src/object-src fall back to default-src 'self' (self-hosted /videos/ only)
# Swagger UI and ReDoc load their JS/CSS from the jsdelivr CDN, so they get a relaxed policy.
map $uri $csp {
    default    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:;";
    /docs      "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; font-src 'self' data: https://cdn.jsdelivr.net; worker-src 'self' blob:;";
    /redoc     "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.redoc.ly; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; worker-src 'self' blob:;";
}

server {
    listen 8080;  # Non-privileged port (was 80)
    # Relative Location headers: absolute ones would leak the internal :8080 and http scheme
    absolute_redirect off;
    server_name _;

    # The client address behind NPM: walk X-Forwarded-For from the right past private proxy
    # hops, so $remote_addr (sent on as X-Real-IP) is the real client, never a spoofed entry (#374)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Client upload size limit
    client_max_body_size 10M;

    # Serve pre-compressed files (gzip/brotli from build)
    gzip_static on;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.api+json;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # Security headers (CSP from $csp above); repeated in every location with its own add_header
    include /etc/nginx/conf.d/security-headers.inc;

    # The FAQ moved into About; keep old links and search results working
    location = /faq {
        return 301 /about#faq;
    }
    location = /faq/ {
        return 301 /about#faq;
    }

    # Vite build assets have content hashes - safe for immutable caching
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Frontend static assets
    location / {
        root /usr/share/nginx/html;
        # Client-only routes get the prerendered app shell, never another page's content (it flashed Home)
        try_files $uri $uri/index.html $uri.html /app-shell/index.html;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Runtime environment config
    location /env-config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Educational video bundle, mounted read-only at deploy time (not in the image). Real files
    # only, never the SPA fallback: the app hides every video entry point when videos.json 404s.
    # File names are not hashed; the app appends ?v=<manifest version> to bust caches.
    location /videos/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        # types{} replaces the global map here, so list every type the bundle uses
        types {
            video/mp4        mp4;
            text/vtt         vtt;
            image/jpeg       jpg jpeg;
            image/png        png;
            image/webp       webp;
            application/json json;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/conf.d/security-headers.inc;

        # The manifest decides what the app shows: always revalidate (also its 404)
        location = /videos/videos.json {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/conf.d/security-headers.inc;
        }
    }

    # Sitemap proxy to backend
    # Footer version popover calls same-origin /version, which lives at the backend root (#428)
    location = /version {
        proxy_pass http://kidney_genetics_backend:8000/version;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
    }

    location = /sitemap.xml {
        proxy_pass http://kidney_genetics_backend:8000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
    }

    # Backend API proxy - FIXED: Use correct container name with underscores
    location /api/ {
        proxy_pass http://kidney_genetics_backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # OpenAPI documentation (Swagger UI, ReDoc, schema) proxied to the backend.
    # FastAPI serves these at the backend root (/docs, /redoc, /openapi.json), so
    # they are NOT under /api/ and need their own proxy rules.
    #
    # They get the relaxed docs CSP from the $csp map and the other security headers
    # from the server-level include (no add_header here, so it is inherited).
    location = /openapi.json {
        proxy_pass http://kidney_genetics_backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /docs {
        proxy_pass http://kidney_genetics_backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /redoc {
        proxy_pass http://kidney_genetics_backend:8000/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # WebSocket support. The backend's only socket is /api/progress/ws: clients reach it
    # directly (DataSourceProgress) or via the WS_URL prefix /ws (services/websocket.ts).
    location ~ ^/(ws|api)/progress/ws$ {
        rewrite ^ /api/progress/ws break;
        proxy_pass http://kidney_genetics_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;  # Use mapped variable
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;

        # WebSocket timeouts (longer)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check (returns JSON for monitoring tools)
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"kidney_genetics_frontend"}';
    }
}
