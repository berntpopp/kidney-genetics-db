# Domain-specific keywords configuration
# Extracted and deduplicated from datasource_config.py lines 29-49 and 123-138

keywords:
  kidney:
    # All kidney-related keywords (deduplicated from PanelApp and GenCC configs)
    # These keywords are used to filter panels and diseases for kidney relevance
    - kidney
    - renal
    - nephro
    - glomerul
    # Note: "tubul" was REMOVED as it's too broad and matches tubulinopathies (brain disorders)
    - tubulopathy  # More specific for kidney tubule disorders
    - tubulointerstitial  # Specific for kidney tubule disorders
    - renotubular  # Fanconi renotubular syndrome (GATM, SLC34A1, EHHADH) (#369)
    - polycystic
    - alport
    - nephritis
    - cystic kidney  # More specific than just "cystic"
    - ciliopathy  # PanelApp panel-name search term only; blanked by kidney_exclude (#451)
    - complement
    - cakut
    - focal segmental
    - steroid resistant
    - nephrotic
    - proteinuria
    - hematuria

  # Terms blanked out of disease/panel text before kidney keyword matching (#369):
  # "renal" is a substring of "adrenal" (congenital adrenal hyperplasia, CYP21A2).
  kidney_exclude:
    - adrenal
    - complementation  # "Fanconi anemia, complementation group S" vs "complement" (#446)
    # Bare "ciliopathy" covers retinal, motile and skeletal ciliopathies (ARL2BP, TUBB4B);
    # kidney ciliopathies still match via nephronophthisis/renal/polycystic/cystic kidney (#451)
    - ciliopathy
    - polycystic lipomembranous  # Nasu-Hakola bone/brain disease (TREM2) (#451)
    - nephropathy due to maternal  # maternal alloimmune, not the child's germline gene (MME) (#451)
