name: CI - Continuous Integration

on:
  # Push only triggers on main/develop (direct commits, merges)
  # Feature branches are covered by pull_request events
  # This avoids duplicate runs when pushing to feature branches with open PRs
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '.planning/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/trivy-security-scan.yml'
      - '.github/workflows/security.yml'
  # Pull requests trigger for all PRs targeting main/develop
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '.planning/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/trivy-security-scan.yml'
      - '.github/workflows/security.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the codebase changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            mcp:
              - 'mcp/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  # =============================================================================
  # Backend CI - Python/FastAPI
  # Matches: make ci-backend
  # =============================================================================
  backend-ci:
    name: Backend CI
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: kidney_user
          POSTGRES_PASSWORD: kidney_pass
          POSTGRES_DB: kidney_genetics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # --locked fails if uv.lock is out of date with pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --group dev

      # Quality checks - matches `make check-backend`
      - name: Run linting (ruff check)
        working-directory: backend
        run: uv run ruff check --no-fix app/

      - name: Run format check (ruff format)
        working-directory: backend
        run: uv run ruff format --check app/

      # Security gates reuse the synced environment; the weekly security.yml run catches new advisories.
      - name: Audit Python dependencies (pip-audit)
        working-directory: backend
        run: uv run pip-audit --vulnerability-service pypi --progress-spinner off

      - name: Python SAST (Bandit)
        working-directory: backend
        run: uv run bandit -q -r app/ --severity-level medium --confidence-level medium

      # Database setup
      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://kidney_user:kidney_pass@localhost:5432/kidney_genetics_test
          JWT_SECRET_KEY: ${{ secrets.TEST_JWT_SECRET_KEY || 'test-jwt-secret-key-minimum-32-characters-long' }}
          ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || 'TestAdmin!2024Secure' }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD || 'kidney_pass' }}
        run: uv run alembic upgrade head

      # Tests - matches `make test`
      - name: Run tests (pytest)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://kidney_user:kidney_pass@localhost:5432/kidney_genetics_test
          JWT_SECRET_KEY: ${{ secrets.TEST_JWT_SECRET_KEY || 'test-jwt-secret-key-minimum-32-characters-long' }}
          ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || 'TestAdmin!2024Secure' }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD || 'kidney_pass' }}
          TEST_DATABASE_URL: postgresql://kidney_user:kidney_pass@localhost:5432/kidney_genetics_test
          TESTING: "true"
        # Timeout after 10 minutes to prevent hanging
        timeout-minutes: 10
        run: uv run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --timeout=300

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # =============================================================================
  # Frontend CI - Vue.js/Vite
  # Matches: make ci-frontend
  # =============================================================================
  frontend-ci:
    name: Frontend CI
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Only shipped (production) dependencies gate the PR; dev-only advisories show in the weekly run.
      - name: Audit production dependencies (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Quality checks - matches npm run lint:check
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint:check

      - name: Run Prettier format check
        working-directory: frontend
        run: npm run format:check

      # Build - matches npm run build
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ""

      # Build-time .html.gz/.br predate vite-ssg prerendering; nginx gzip_static would serve them (#312)
      - name: Guard against precompressed HTML
        working-directory: frontend
        run: |
          stale=$(find dist -name '*.html.gz' -o -name '*.html.br')
          if [ -n "$stale" ]; then echo "::error::precompressed HTML in dist:"; echo "$stale"; exit 1; fi

      # Tests - matches npm run test:run
      - name: Run frontend tests (Vitest)
        working-directory: frontend
        run: npm run test:run

  # =============================================================================
  # MCP CI - Python/FastMCP
  # Matches: make check-mcp
  # =============================================================================
  mcp-ci:
    name: MCP CI
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: "mcp/uv.lock"

      - name: Install dependencies
        working-directory: mcp
        run: uv sync --locked --group dev

      - name: Run MCP checks
        run: make check-mcp

      # pip-audit is not an MCP dev dependency; audit the exported runtime lock with the backend's pinned version.
      - name: Audit runtime dependencies (pip-audit)
        working-directory: mcp
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/mcp-requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/mcp-requirements.txt" --disable-pip --require-hashes --progress-spinner off

  # =============================================================================
  # CI Summary - aggregates all results (skipped jobs are fine)
  # =============================================================================
  ci-summary:
    name: CI Summary
    needs: [changes, backend-ci, frontend-ci, mcp-ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check CI results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          BACKEND: ${{ needs.backend-ci.result }}
          FRONTEND: ${{ needs.frontend-ci.result }}
          MCP: ${{ needs.mcp-ci.result }}
        run: |
          {
            echo "## CI Results Summary"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Backend CI | $BACKEND |"
            echo "| Frontend CI | $FRONTEND |"
            echo "| MCP CI | $MCP |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FAILED" == "true" ]]; then
            echo "::error::A CI job failed or was cancelled"
            exit 1
          fi
