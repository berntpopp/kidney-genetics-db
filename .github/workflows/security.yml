name: Security Scanning

# PRs and pushes run these gates inside ci.yml (only for the component that changed).
# This weekly run re-audits the unchanged lockfiles so new advisories surface on a quiet repo.
on:
  schedule:
    # Weekly Monday 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit and SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.x'

      # Every step runs even if an earlier one fails, so one report covers all components.
      - name: Backend pip-audit
        if: always()
        working-directory: backend
        run: |
          uv sync --locked --group dev
          uv run pip-audit --vulnerability-service pypi --progress-spinner off

      - name: Backend Bandit
        if: always()
        working-directory: backend
        run: uv run bandit -q -r app/ --severity-level medium --confidence-level medium

      - name: MCP pip-audit
        if: always()
        working-directory: mcp
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/mcp-requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/mcp-requirements.txt" --disable-pip --require-hashes --progress-spinner off

      # npm audit reads only package-lock.json, so no install is needed.
      - name: Frontend npm audit (production, high)
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend npm audit (all, critical)
        if: always()
        working-directory: frontend
        run: npm audit --audit-level=critical
